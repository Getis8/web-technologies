<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Task 1: Table</title>
</head>
<body>
 <table border="2" cellspacing="0">
  <tr>
    <td colspan="8" bgcolor="gray"></td>
  </tr>
  <tr>
    <td rowspan="6" bgcolor="gray"></td>
    <td colspan="6" bgcolor="brown"></td>
    <td rowspan="6" bgcolor="gray"></td>
  </tr>
  <tr>
    <td rowspan="4" bgcolor="brown"></td>
    <td colspan="4" bgcolor="green"></td>
    <td rowspan="4" bgcolor="brown"></td>
  </tr>
  <tr>
    <td rowspan="2" bgcolor="green"></td>
    <td bgcolor="pink"></td>
    <td bgcolor="purple"></td>
    <td rowspan="2" bgcolor="green"></td>
  </tr>
  <tr>
    <td bgcolor="purple"></td>
    <td bgcolor="pink"></td>
  </tr>
  <tr>
    <td colspan="4" bgcolor="green"></td>
  </tr>
  <tr>
    <td colspan="6" bgcolor="brown"></td>
  </tr>
  <tr><td colspan="8" bgcolor="gray"></td></tr>
 </table>
</body>
</html>
